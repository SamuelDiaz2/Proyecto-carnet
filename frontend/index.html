<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carnet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        // Verificar si el usuario ya inició sesión
        const nombreGuardado = localStorage.getItem("usuarioNombre");
        const cedulaGuardada = localStorage.getItem("usuarioCedula");

        if (nombreGuardado && cedulaGuardada) {
            console.log("Usuario ya inició sesión, redirigiendo al dashboard...");
            window.location.href = "dashboard.html";
        }
    </script>

    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        <input type="text" id="documentoInput" autocomplete="on" placeholder="Ingresa tu número de documento" inputmode="numeric">
        <button id="btnGuardar">Entrar</button>
        <p id="mensaje"></p>
    </div>

    <div id="carnet-container">
        <div class="carnet">
            <h2 id="displayNombre."></h2>
            <p id="displayCedula"></p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
