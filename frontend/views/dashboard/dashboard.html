<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Dashboard - Carnet</title>
    <link rel="stylesheet" href="../../css/styleadmin.css">
</head>
<body>
    <div id="menuIcon" class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div id="sideMenu" class="side-menu">
        <br>
        <nav id="options">
            <a href="dashboard.html">Mi Carnet</a>
        </nav>
    </div>

    <div id="overlay" class="overlay"></div>

    <script>
        const menuIcon = document.getElementById('menuIcon');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');

        menuIcon.addEventListener('click', () => {
        sideMenu.classList.toggle('active');
        overlay.classList.toggle('active');
    });

// Cerrar al hacer clic fuera
        overlay.addEventListener('click', () => {
        sideMenu.classList.remove('active');
        overlay.classList.remove('active');
    });
    </script>

    <div id="carnet-container" style="display: block; text-align: center; margin-top: 50px;">
        <div id="btnAdmin"></div>
        <div class="carnet">
            <div class="carnet-header">
                <h3>REHABILITAR-C</h3>
            </div>

            <div class="foto-container">
                <img src="../../img/usuario.png" id="displayFoto">
            </div>

            <div class="info-user">
                <h2 id="displayNombre">Cargando...</h2>
                
                <p class="label">Documento de Identidad</p>
                <p class="value" id="displayCedula">0000000000</p>

            </div>

            <div class="carnet-footer">
                <img src="../../img/logo.jpeg" id="logo-empresa" style="max-height: 150px;">
                <p>Válido para acceso administrativo</p>
            </div>
        </div>
    </div>

    <script>
        // Obtenemos los datos guardados al iniciar sesión
        const nombre = localStorage.getItem("usuarioNombre");
        const cedula = localStorage.getItem("usuarioCedula");
        const fotoData = localStorage.getItem("usuarioFoto");

        if (fotoData && fotoData !== "") {
            document.getElementById("displayFoto").src = fotoData;
        } else {
            document.getElementById("displayFoto").src = "../../img/usuario.png";
        }

        // Si no existen datos, devolvemos al index
        if (!nombre || !cedula) {
            console.log("No se encontraron datos de usuario en localStorage");
            window.location.href = "/frontend/index.html";
        } else {
            // Inyectamos los datos en el carnet
            document.getElementById("displayNombre").innerText = nombre;
            document.getElementById("displayCedula").innerText = cedula;
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/frontend/index.html";
        }
    </script>
    <script type="module" src="./dashboard.js"></script>
</body>
</html>
